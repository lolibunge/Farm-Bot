<svg viewBox="0 0 1850 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">Mapa esquemático del campo La Ercilia</title>
<desc id="desc">Croquis de los potreros de La Ercilia, de oeste a este, versión actual (sin la nueva distribución 2026). Editable en Affinity Designer.</desc>

<style>
  .lbl { font-family: -apple-system, sans-serif; fill: #ffffff; font-weight: 600; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 3px; stroke-linejoin: round; text-anchor: middle; }
  .lblsm { font-size: 10px; }
  .lblmd { font-size: 12.5px; }
  .lbllg { font-size: 16px; }
  .lblxs { font-size: 9px; }
</style>

<rect x="0" y="0" width="1850" height="700" fill="#efe9d8" />
<rect x="0" y="0" width="1850" height="18" fill="#c9c3a8" />
<line x1="0" y1="30" x2="1850" y2="15" stroke="#b7b096" stroke-width="10" stroke-dasharray="2 10" />

<!-- Pistas / Cuadrilatero -->
<polygon points="40,40 180,35 175,150 45,155" fill="#d97a4d" stroke="#8a4a29" stroke-width="2"/>
