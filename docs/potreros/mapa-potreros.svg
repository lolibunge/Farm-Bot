<!-- arroyo -->
<path d="M 1060,470 C 1120,510 1150,560 1210,590 C 1300,630 1380,420 1470,320 C 1560,230 1650,270 1740,210" fill="none" stroke="#5a8fc4" stroke-width="3" opacity="0.7" />

